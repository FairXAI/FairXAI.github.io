<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paint Shop · Top-Down 2D</title>
<style>
/* One committed look: a dark hull with a cold instrument blue. Every colour is painted
   explicitly so the page holds whatever ground the host puts behind it. */
:root{
  --ground:#0c1118; --panel:#141b25; --panel2:#1b2431; --rule:#26313f; --rule-hi:#3a4a5e;
  --ink:#e6edf5; --dim:#9fb0c3; --faint:#67788c;
  --accent:#4fb3ff; --live:#ffb640; --ok:#4fd48a; --bad:#ff5f56;
  --ok-bg:#12321f; --bad-bg:#3a1512; --live-bg:#3b2a0c;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --game:"Kenney Future","Trebuchet MS",var(--sans);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;
       border-bottom:1px solid var(--rule);background:var(--panel)}
h1{font:600 18px/1 var(--game);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1 a{color:inherit;text-decoration:none}
header .scene{color:var(--dim);font-size:12.5px;max-width:70ch}
header .pick{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--rule-hi);border-radius:4px;
       padding:5px 8px;font:12.5px var(--mono);max-width:360px}
select:focus-visible{outline:2px solid var(--accent)}

.shell{display:grid;grid-template-columns:minmax(300px,auto) minmax(360px,1fr);gap:18px;
       padding:16px 18px;align-items:start}

/* ---------------- the game ---------------- */
#stage{position:relative;height:var(--h,calc(100vh - 92px));aspect-ratio:var(--ar,480/912);
       background:#05080c;border:1px solid var(--rule-hi);
       border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px #0a0f16,0 18px 40px #0008;
       user-select:none}
#stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;
    image-rendering:crisp-edges;display:block}
.fx{position:absolute;pointer-events:none;image-rendering:pixelated;transition:opacity .6s}
#menu{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;background:#0e1620ee;
      border:1px solid var(--rule-hi);border-radius:6px;padding:8px 10px;
      backdrop-filter:blur(2px);display:flex;flex-direction:column;gap:7px}
#menu[hidden]{display:none}
#menu .zt{font:600 12px var(--game);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
          display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#menu .zt small{font:11px var(--mono);letter-spacing:0;text-transform:none;color:var(--faint)}
#menu .acts{display:flex;flex-wrap:wrap;gap:6px}
.act{border:14px solid transparent;
     border-image:var(--btn-blue) 22 20 20 20 fill / 14px 12px 12px 12px stretch;
     background:none;padding:2px 6px 0;color:#0d2233;font:600 12px/1.2 var(--game);
     letter-spacing:.04em;cursor:pointer;min-width:84px;text-align:center}
.act:hover{filter:brightness(1.1)}
.act:active{transform:translateY(1px)}
.act:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.act.new{border-image-source:var(--btn-yellow)}
.act kbd{display:inline-block;font:600 10px var(--mono);background:#0d223388;color:#fff;
         border-radius:3px;padding:0 4px;margin-right:5px;vertical-align:1px}
.act.new kbd{background:#5a3a0088}
#menu .none{color:var(--faint);font-size:12px;font-style:italic}
#hud{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#hud .tag{background:#0e1620dd;border:1px solid var(--rule-hi);border-radius:4px;padding:3px 8px;
          font:600 11px var(--game);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#hud .tag b{color:var(--ink)}
#goalfx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        pointer-events:none;background:#0a2a1aaa}
#goalfx[hidden]{display:none}
#goalfx div{background:#0e1620;border:2px solid var(--ok);border-radius:8px;padding:14px 22px;
            font:600 20px var(--game);letter-spacing:.14em;text-transform:uppercase;color:var(--ok);
            text-align:center;box-shadow:0 0 30px #4fd48a66;max-width:80%}
#goalfx div small{display:block;font:12px var(--sans);letter-spacing:0;text-transform:none;
                  color:var(--dim);margin-top:6px}

/* ---------------- side panels ---------------- */
aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.block{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;
       display:flex;flex-direction:column;gap:8px}
h2.lbl{font:600 10.5px/1 var(--game);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
#who{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
#who .nm{font:600 13px var(--mono)}
.verdict{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;
         padding:2px 8px;border-radius:3px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.err{background:var(--panel2);color:var(--dim)}
#who .file{margin-left:auto;font:10.5px var(--mono);color:var(--faint);word-break:break-all}
.req{border-left:3px solid var(--live);background:var(--live-bg);padding:7px 11px;
     color:#f3d8a4;font-size:12.5px;border-radius:0 4px 4px 0}
.req b{display:block;font:600 9.5px var(--game);letter-spacing:.16em;text-transform:uppercase;
       color:var(--live);margin-bottom:3px}
.keys{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:12px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys img{height:26px;image-rendering:auto;filter:invert(.9)}
table{border-collapse:collapse;width:100%;font:12.5px/1.6 var(--mono)}
td{padding:2px 10px 2px 0;vertical-align:top}
td.k{color:var(--dim);white-space:nowrap}
td.v{font-weight:600}
.v.t{color:var(--ok)} .v.f{color:var(--faint)} .v.s{color:var(--accent)}
td.k.novel::after{content:" ·not declared";color:var(--live);font-weight:400;font-size:10px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--rule)}
.chk:first-of-type{border-top:0;padding-top:0}
.chk .mk{font:700 13px/1.4 var(--mono);flex:none;width:14px}
.chk.ok .mk{color:var(--ok)} .chk.bad .mk{color:var(--bad)}
.chk .nm{font:600 12.5px var(--mono)}
.chk.bad .nm{color:var(--bad)}
.chk .pr{color:var(--dim);font-size:12px}
.chk .form{color:var(--faint);font:500 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.chk .vac{color:var(--live);font-size:11px}
.ghost{border:1px solid var(--rule-hi);background:var(--panel2);color:var(--dim);
       font:500 11.5px var(--mono);padding:4px 11px;border-radius:4px;cursor:pointer}
.ghost:hover:not([disabled]){color:var(--ink);border-color:var(--accent)}
.ghost:focus-visible{outline:2px solid var(--accent)}
.ghost[disabled]{opacity:.4;cursor:default}
#bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#trail{color:var(--dim);font:12px/1.7 var(--mono);word-break:break-word;min-height:20px}
#trail b{color:var(--accent);font-weight:500}
.errbox{border:1px solid var(--rule-hi);background:var(--panel2);border-radius:4px;padding:10px 12px;
        color:var(--dim);font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
#gwrap{border:1px solid var(--rule);border-radius:4px;background:var(--panel2);overflow:auto;max-height:46vh}
#graph{display:block}
.node{cursor:pointer}
.node circle{fill:var(--panel);stroke:var(--rule-hi);stroke-width:1.5}
.node.visited circle{stroke:var(--accent)}
.node.cur circle{fill:var(--accent);stroke:#9fd8ff;stroke-width:2}
.node.goal circle{stroke:var(--ok);stroke-width:2}
.node.bad circle{fill:var(--bad-bg);stroke:var(--bad);stroke-width:2.5}
.node text{fill:var(--dim);font:500 8.5px var(--mono);text-anchor:middle;pointer-events:none}
.node.cur text{fill:#06121c;font-weight:700}
.node:focus-visible circle{stroke:#fff;stroke-width:2.5}
.edge{stroke:#3a4a5e;stroke-width:1.2;fill:none;marker-end:url(#a)}
.edge.walked{stroke:var(--accent);stroke-width:2;marker-end:url(#ab)}
.edge.ce{stroke:var(--bad);stroke-width:2.4;stroke-dasharray:5 3;marker-end:url(#ar)}
.edge.live{stroke:var(--live);stroke-width:1.8;marker-end:url(#aw)}
.elabel{font:500 8.5px var(--mono);text-anchor:middle;pointer-events:none}
.legend{color:var(--faint);font:11px var(--mono);display:flex;gap:14px;flex-wrap:wrap}
.legend i{font-style:normal}
.sw{display:inline-block;width:15px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:middle;margin-right:5px}
.credit{color:var(--faint);font-size:11px;line-height:1.5}
.credit a{color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:900px){.shell{grid-template-columns:1fr}
  #stage{height:auto;width:100%;max-width:520px;margin:0 auto}}
</style>
</head>
<body>

<header>
  <h1 id="tname"></h1>
  <div class="scene" id="sdesc"></div>
  <label class="pick">world <select id="world" aria-label="world"></select></label>
</header>

<div class="shell">
  <div id="stage" tabindex="0" aria-label="game">
    <canvas id="cv"></canvas>
    <div id="fxlayer"></div>
    <div id="hud"></div>
    <div id="goalfx" hidden><div>Goal reached<small id="goaltext"></small></div></div>
    <div id="menu" hidden></div>
  </div>

  <aside>
    <div class="block">
      <div id="who"></div>
      <div class="req" id="req" hidden></div>
      <div class="errbox" id="err" hidden></div>
      <div class="keys" id="keys"></div>
    </div>
    <div class="block">
      <h2 class="lbl">Walk</h2>
      <div id="bar">
        <button class="ghost" id="undo">&larr; undo (Z)</button>
        <button class="ghost" id="reset">reset (R)</button>
      </div>
      <div id="trail"></div>
    </div>
    <div class="block">
      <h2 class="lbl">Reachable State Graph</h2>
      <div id="gwrap"><svg id="graph"></svg></div>
      <div class="legend">
        <i><span class="sw" style="border-top-color:var(--accent)"></span>walked</i>
        <i><span class="sw" style="border-top-color:var(--live)"></span>available now</i>
        <i><span class="sw" style="border-top-color:var(--bad);border-top-style:dashed"></span>counterexample</i>
        <i><span class="sw" style="border-top-color:var(--ok)"></span>ring = goal</i>
        <i>click a node to jump there</i>
      </div>
    </div>
    <div class="block">
      <h2 class="lbl">State</h2>
      <table id="stab"></table>
    </div>
    <div class="block">
      <h2 class="lbl">Causal Relations</h2>
      <div id="checks"></div>
    </div>
    <div class="block credit" id="credit"></div>
  </aside>
</div>

const cv = $("#cv"), ctx = cv.getContext("2d");

/* draw a sprite rect [img,sx,sy,sw,sh] (or {fill}) into a box; tint paints over its pixels */
function spr(r, x, y, w, h, opt={}){

  w = w || TS; h = h || TS;
  if(!Array.isArray(r)){                  // a flat colour, {fill, blink} — arrays have their own .fill
    if(!r.fill) return;
    if(r.blink && Math.sin(performance.now()/120) < 0) return;
    ctx.fillStyle = r.fill; ctx.fillRect(x, y, w, h); return; }
  const im = IMG[r[0]]; if(!im || !im.complete || !im.naturalWidth) return;
  if(opt.tint){
    off.width = Math.ceil(w*S); off.height = Math.ceil(h*S);
    octx.setTransform(S,0,0,S,0,0); octx.imageSmoothingEnabled = !!TH.smooth; octx.clearRect(0,0,w,h);
    octx.drawImage(im, r[1], r[2], r[3], r[4], 0, 0, w, h);
    octx.globalCompositeOperation = "source-atop"; octx.fillStyle = opt.tint; octx.fillRect(0,0,w,h);
    octx.globalCompositeOperation = "source-over";
    ctx.drawImage(off, x, y, w, h); return;

const hash = (a,b) => ((a*73856093) ^ (b*19349663)) >>> 0;
let last = performance.now(), waveT = 0;

function frame(now){

function step(dt){
  const s = drawable(E) ? state() : {};
  for(const d of DOORS){ const tgt = s[d.key] ? 1 : 0; d.open += Math.sign(tgt-d.open)*Math.min(Math.abs(tgt-d.open), dt*2.4); }
  for(const r of rooms){ const tgt = targetWater(r); water[r] += Math.sign(tgt-water[r])*Math.min(Math.abs(tgt-water[r]), dt*0.9); }
  for(const t of TOKENS){ const p = tokenTarget(t, s); if(p){ t.x += (p.x-t.x)*Math.min(1,dt*7); t.y += (p.y-t.y)*Math.min(1,dt*7); } }
  if(D.tween){
    const k = Math.min(1, (performance.now()-D.tween.t0)/D.tween.dur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    D.x = D.tween.x0 + (D.tween.x1-D.tween.x0)*e; D.y = D.tween.y0 + (D.tween.y1-D.tween.y0)*e;
    D.moving = true; D.angle = D.tween.y1 < D.tween.y0 ? -Math.PI/2 : Math.PI/2;
    if(k>=1){ D.tween = null; D.moving = false; refreshMenu(); }
  } else if(drawable(E)){
    const r = roomOf(s);
    let vx = (keys.ArrowRight||keys.d ? 1:0) - (keys.ArrowLeft||keys.a ? 1:0);
    let vy = (keys.ArrowDown||keys.s ? 1:0) - (keys.ArrowUp||keys.w ? 1:0);
    D.moving = !!(vx||vy);
    if(D.moving){
      const sp = 165*dt, L2 = Math.hypot(vx,vy);
      D.x += vx/L2*sp; D.y += vy/L2*sp;
      if(vx) D.face = vx;
      D.angle = Math.atan2(vy, vx);
      if(r){ const g = geo(ridx(r));
        D.x = Math.max(22, Math.min(W-22, D.x));
        D.y = Math.max(g.floorTop+10, Math.min(g.floorBot-8, D.y)); }
      const z = activeZone(); if((z&&z.id) !== (menuZone&&menuZone.id)) refreshMenu();
    }

}

    const pr = p.r >= WALL_ROWS ? WALL_ROWS + (p.r-WALL_ROWS)*FLOOR_ROWS/BASE_FLOOR : p.r;
    const x = p.c*TS, y = g.top + pr*TS, w = (p.w||1)*TS, h = (p.h||1)*TS;
    if(p.spin){
      if(!matches(p.spin, s)) continue;

  if(art.npc){                                // someone standing behind the counter, facing the room
    const r = art.npc, sz = TS*0.92, ar = r[4]/r[3], w = ar>1 ? sz/ar : sz, h = ar>1 ? sz : sz*ar;
    ctx.save(); ctx.translate((colX+1)*TS, g.wallTop + 2.45*TS);

function drawDoor(d, g){

  else { m.style.top = "auto"; m.style.bottom = "8px"; }
  m.hidden = false;
  m.querySelectorAll(".act").forEach(b=>b.onclick=()=>{ apply(acts[+b.dataset.i]); $("#stage").focus(); });
}
const stage = $("#stage");
stage.addEventListener("keydown", ev=>{
  if(ev.key.startsWith("Arrow") || "wasd".includes(ev.key.toLowerCase())){ keys[ev.key.length===1?ev.key.toLowerCase():ev.key] = true; ev.preventDefault(); return; }
  if(!drawable(E)) return;
  const acts = actionsFor(activeZone());
  if(/^[1-9]$/.test(ev.key) && acts[+ev.key-1]){ apply(acts[+ev.key-1]); ev.preventDefault(); }
  else if(ev.key==="e"||ev.key==="E"||ev.key==="Enter"||ev.key===" "){ if(acts[0]) apply(acts[0]); ev.preventDefault(); }
  else if(ev.key==="z"||ev.key==="Z"){ undo(); ev.preventDefault(); }
  else if(ev.key==="r"||ev.key==="R"){ ce = -1; jump(E.init, []); ev.preventDefault(); }
});
stage.addEventListener("keyup", ev=>{ keys[ev.key.length===1?ev.key.toLowerCase():ev.key] = false; });
stage.addEventListener("blur", ()=>{ for(const k in keys) keys[k]=false; });
stage.addEventListener("pointerdown", ()=>stage.focus());
$("#undo").onclick = ()=>{ undo(); stage.focus(); };
$("#reset").onclick = ()=>{ ce = -1; jump(E.init, []); stage.focus(); };

/* ------------------------------------------------------------------ state graph */
function pathTo(target){                        // BFS over the frozen graph, for node clicks
  if(target === E.init) return [];
  const prev = new Map([[E.init,null]]), q = [E.init];
  while(q.length){
    const n = q.shift();
    for(const e of outOf(n)) if(!prev.has(e.dst)){
      prev.set(e.dst,e);
      if(e.dst===target){ const out=[]; let k=e; while(k){ out.unshift(k); k=prev.get(k.src); } return out; }
      q.push(e.dst);
    }
  }
  return null;
}
const walkedEdges = () => { let n=E.init; return trail.map(a=>{
  const e = outOf(n).find(x=>x.action===a); n = e.dst; return e; }); };
function ceEdges(){
  const c = E.checks[ce], out=[];
  for(let i=0;i<c.path.length-1;i++)
    out.push(E.edges.find(e=>e.src===c.path[i]&&e.dst===c.path[i+1]&&e.action===c.actions[i]));
  return out.filter(Boolean);
}
function drawGraph(){
  const g = $("#graph"), CW=104, RH=50, PAD=26;
  g.textContent = "";
  if(!drawable(E)){ g.setAttribute("width",0); g.setAttribute("height",0); return; }
  if(E.nodes.length > 400){ g.setAttribute("width",420); g.setAttribute("height",40);
    g.appendChild(el("text",{x:10,y:24,fill:"#9fb0c3","font-size":12},[txt(`${E.nodes.length} states, ${E.edges.length} steps: too many to draw; the game still plays`)])); return; }
  const cols = Math.max(...E.nodes.map(n=>n.col))+1, rows = Math.max(...E.nodes.map(n=>n.row))+1;
  g.setAttribute("width",  PAD*2 + (cols-1)*CW + 40);
  g.setAttribute("height", PAD*2 + (rows-1)*RH + 40);
  const P = n => [PAD+20+n.col*CW, PAD+20+n.row*RH];
  const defs = el("defs");
  [["a","#3a4a5e"],["ab","#4fb3ff"],["ar","#ff5f56"],["aw","#ffb640"]]
    .forEach(([id,c])=> defs.appendChild(el("marker",
      {id,viewBox:"0 0 8 8",refX:7,refY:4,markerWidth:5,markerHeight:5,orient:"auto"},
      [el("path",{d:"M0 0 L8 4 L0 8 z",fill:c})])));
  g.appendChild(defs);
  const walked = new Set(walkedEdges()), live = new Set(outOf(cur));
  const cePath = ce>=0 ? new Set(ceEdges()) : new Set();
  const visited = new Set([E.init, ...walkedEdges().map(e=>e.dst)]);
  const badNode = ce>=0 ? E.checks[ce].path[E.checks[ce].path.length-1] : null;
  const lab = [];
  E.edges.forEach(e=>{
    const [x1,y1]=P(E.nodes[e.src]), [x2,y2]=P(E.nodes[e.dst]);
    const dx=x2-x1, dy=y2-y1, Ln=Math.hypot(dx,dy)||1, r=13;
    const sx=x1+dx/Ln*r, sy=y1+dy/Ln*r, ex=x2-dx/Ln*(r+3), ey=y2-dy/Ln*(r+3);
    const mx=(sx+ex)/2, my=(sy+ey)/2 - (dy===0?0:12);
    let cls = "edge";
    if(cePath.has(e)) cls+=" ce"; else if(walked.has(e)) cls+=" walked"; else if(live.has(e)) cls+=" live";
    g.appendChild(el("path",{class:cls,d:`M${sx} ${sy} Q${mx} ${my} ${ex} ${ey}`}));
    if(live.has(e)||cePath.has(e)) lab.push([mx,my-4,e.action,cePath.has(e)]);
  });
  E.nodes.forEach(n=>{
    const [x,y]=P(n);
    let cls="node";
    if(n.id===cur) cls+=" cur"; else if(visited.has(n.id)) cls+=" visited";
    if(n.goal) cls+=" goal";
    if(n.id===badNode) cls+=" bad";
    const grp = el("g",{class:cls,tabindex:0,role:"button","aria-label":`state ${n.id}`});
    grp.appendChild(el("circle",{cx:x,cy:y,r:13}));
    if(n.goal) grp.appendChild(el("circle",{cx:x,cy:y,r:16.5,fill:"none",stroke:"#4fd48a","stroke-width":1}));
    grp.appendChild(el("text",{x,y:y+3},[txt(String(n.id))]));
    grp.appendChild(el("title",{},[txt(Object.entries(n.state).map(([k,v])=>`${k} = ${v}`).join("\n"))]));
    const go = ()=>{ const p = pathTo(n.id); if(p) jump(n.id, p.map(e=>e.action)); };
    grp.addEventListener("click",go);
    grp.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); go(); }});
    g.appendChild(grp);
  });
  lab.forEach(([x,y,t,isCe])=>g.appendChild(el("text",{x,y,class:"elabel",fill:isCe?"#ff5f56":"#ffb640"},[txt(t)])));
  const curEl = g.querySelector(".node.cur");
  if(curEl && curEl.scrollIntoView) curEl.scrollIntoView({block:"nearest",inline:"nearest"});
}

/* ------------------------------------------------------------------ side panels */
function syncPicker(){ $("#world").value = String(T.entries.indexOf(E)); }
function buildPicker(){
  const sel = $("#world"); sel.innerHTML = "";
  for(const r of T.rounds) for(const s of T.sources){
    const items = T.entries.filter(e=>e.round===r.id && e.source===s.id);
    if(!items.length) continue;
    const og = document.createElement("optgroup"); og.label = `${r.label} · ${s.label}`;
    for(const e of items){ const o = document.createElement("option");
      o.value = String(T.entries.indexOf(e));
      const v = verdict(e); o.textContent = `${e.item}  ${v==="ok"?"✓":v==="bad"?"✗ broken":"⚠ would not load"}`;
      og.appendChild(o); }
    sel.appendChild(og);
  }
  sel.onchange = ()=>{ select(T.entries[+sel.value]); stage.focus(); };
}
function render(){
  const s = SOURCE[E.source], r = ROUND[E.round], v = verdict(E);
  $("#who").innerHTML = `<span class="nm">${esc(s.label)} · ${esc(r.label)} · ${esc(E.item)}</span>
    <span class="verdict ${v}">${v==="ok"?"all relations hold":v==="bad"?"relation broken":"would not load"}</span>
    <span class="file">${esc(E.file)}</span>`;
  const req = $("#req"); req.hidden = !r.requirement;
  if(r.requirement) req.innerHTML = `<b>requirement added in this round (earlier ones stay)</b>${esc(r.requirement)}` +
    (r.possibility ? `<div style="margin-top:4px;color:#c9a86a;font-size:11.5px">must make possible: ${esc(r.possibility)}</div>` : "");
  const err = $("#err"); err.hidden = E.ok && !E.note; if(!E.ok || E.note) err.textContent = E.ok ? E.note : (E.error || "this world would not load");

  const st = drawable(E) ? state() : {};
  $("#stab").innerHTML = Object.entries(st).map(([k,val])=>{
    const cls = typeof val==="boolean" ? (val?"t":"f") : "s", novel = !(k in T.declared);
    return `<tr><td class="k${novel?" novel":""}">${esc(k)}</td><td class="v ${cls}">${esc(val)}</td></tr>`; }).join("");

  $("#checks").innerHTML = (E.checks||[]).map((c,i)=>`<div class="chk ${c.holds?"ok":"bad"}">
    <span class="mk">${c.holds?"✓":"✗"}</span><div>
    <div><span class="nm">${esc(c.name)}</span> <span class="form">${esc(c.form)}</span>
    ${c.vacuous?'<span class="vac">· vacuous</span>':''}</div>
    <div class="pr">${esc(c.prose)}</div>
    ${!c.holds && c.path ? `<button class="ghost" data-ce="${i}" style="margin-top:5px">show counterexample (${c.actions.length} steps)</button>` : ""}
    </div></div>`).join("") || '<span style="color:var(--faint)">no relations recorded</span>';
  document.querySelectorAll("[data-ce]").forEach(b=>b.onclick=()=>{ const c = E.checks[+b.dataset.ce];
    ce = +b.dataset.ce; jump(c.path[c.path.length-1], c.actions); stage.focus(); });

  $("#trail").innerHTML = trail.length ? trail.map(a=>`<b>${esc(a)}</b>`).join(" → ") :
    '<span style="color:var(--faint)">walk up to something and pick an action</span>';
  $("#undo").disabled = !trail.length;
  $("#goalfx").hidden = !(drawable(E) && E.nodes[cur].goal);
  const hud = $("#hud");
  hud.innerHTML = `<div class="tag">state <b>#${cur}</b> · ${trail.length} step${trail.length===1?"":"s"}</div>` +
    (drawable(E) && KIND==="rooms" && !roomOf(st) ? `<div class="tag" style="color:var(--live)">no ${esc(LOC)} in this state — ${esc(MOVER)} parked</div>` : "");
  drawGraph();
  refreshMenu();
}

/* ------------------------------------------------------------------ boot */
$("#tname").innerHTML = `<a href="index.html" title="all scenes">${esc(T.name.replace("_"," "))}</a>`;
$("#sdesc").textContent = T.scene + " Goal: " + T.goal.prose;
$("#goaltext").textContent = T.goal.prose + " · Z undo · R reset";
$("#keys").innerHTML = `<span><img src="${A.key_arrows.src}" alt="arrows">move (or WASD)</span>
  <span><img src="${A.key_e.src}" alt="E">first action · 1–9 pick</span>
  <span><img src="${A.key_z.src}" alt="Z">undo</span><span><img src="${A.key_r.src}" alt="R">reset</span>`;
$("#credit").innerHTML = (DATA.credit || "") + " The game walks the verifier's own frozen state graph; it never runs world code.";
if(KIND==="none"){ $("#err").hidden = false; $("#err").textContent = "this scene has neither a spatial axis nor a process to lay out"; }
buildPicker();
select(REF || T.entries[0]);
stage.focus();
requestAnimationFrame(frame);
</script>
